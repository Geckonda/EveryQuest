<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- iPhone берёт иконку отсюда, а не из манифеста; полноэкранный режим — тоже по своим тегам. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ежеквестик" />
    <!-- Цвет полосы браузера — как у вывески в шапке (в обеих темах она тёмная). -->
    <meta name="theme-color" content="#2b1d10" />
    <meta name="description" content="Квесты за золото, отдых — за заработанное" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ежеквестик</title>
    <script>
      // Тема до загрузки приложения — иначе тёмная тема мигнула бы светлой (см. useTheme).
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('eq.theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
